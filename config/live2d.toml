# ── Live2D 立绘配置 ──
# 本文件由「设置 → Live2D」界面写入，也可手工编辑（改完重启妹抖酱生效）。
#
# 动作名 = motions/ 下的 *.motion3.json 去掉扩展名
# 表情名 = 模型目录下的 *.exp3.json 去掉扩展名
#
#   [model]             模型目录 / 定义文件 / 播放器页面 / 回退开关
#   [behavior]          idle 时是否清掉表情
#   [interaction]       点击轮换表情、视线跟随系数
#   [state_map.<阶段>]  对话阶段 → 动作 / 表情
#
# 状态名来自引擎上报的对话阶段：thinking / tool / found / writing / idle / error
# 空字符串 = 清掉表情回到默认脸；想「保持当前表情不动」就把该行整行删掉。
[model]
dir = "assets/live2d/DS鲸鱼娘"
definition = "c_0120.model3.json"
viewer = "assets/live2d/viewer/index.html"
fallback_to_static = true

[behavior]
clear_expression_on_idle = true

[interaction]
click_expressions = ["调皮", "吐舌", "爱心眼", "星星眼", "脸红", "单边马尾", "兔兔贴纸", "吐魂", "呆呆眼", "喵喵手~喵~动画", "墨镜", "圆眼镜", "头箍", "巴菲", "情绪花花", "感叹号", "手机换色", "挤", "方眼镜", "晕晕", "橡皮", "椭圆眼镜", "深色桌布", "点菜按下", "猫猫贴纸", "生气", "蛋包饭", "蝴蝶结贴纸", "闭眼口水", "问号", "阴暗", "魔爪", "魔爪换色", "鲸鱼", "鲸鱼放桌上"]
click_revert_seconds = 1.5
focus_gain = 0.35
focus_rest_seconds = 1.2

[state_map]

[state_map.idle]
motion = "idle"
expression = ""

[state_map.thinking]
motion = ""
expression = "呆呆眼"

[state_map.tool]
motion = ""
expression = "流汗"

[state_map.found]
motion = "喷水"
expression = "星星眼"

[state_map.writing]
motion = ""
expression = "画笔"

[state_map.error]
motion = ""
expression = "晕晕"
